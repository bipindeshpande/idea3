name: Backend Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_idea3
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      working-directory: backend_v2
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run unit tests
      working-directory: backend_v2
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_idea3
        TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_idea3
        ADMIN_PASSWORD: admin2024
      run: |
        pytest tests/unit -v --cov=app --cov-report=xml --cov-report=term
    
    - name: Run integration tests
      working-directory: backend_v2
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_idea3
        TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_idea3
        ADMIN_PASSWORD: admin2024
      run: |
        pytest tests/integration -v --cov=app --cov-append --cov-report=xml --cov-report=term
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./backend_v2/coverage.xml
        flags: backend

