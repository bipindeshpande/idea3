version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: idea2_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-startup_discovery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-startup_discovery}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-startup_discovery} -d ${POSTGRES_DB:-startup_discovery}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network
    # Don't expose ports in production (internal only)

  redis:
    image: redis:7-alpine
    container_name: idea2_redis_prod
    volumes:
      - redis_data_prod:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Don't expose ports in production (internal only)

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: idea2_backend_prod
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-startup_discovery}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-startup_discovery}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENVIRONMENT=production
      - DEBUG=false
    env_file:
      - production.env
    volumes:
      - ./migrations:/app/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Don't expose ports directly (via nginx)

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: idea2_worker_prod
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-startup_discovery}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-startup_discovery}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENVIRONMENT=production
      - DEBUG=false
    env_file:
      - production.env
    volumes:
      - ./migrations:/app/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "python", "-c", "from app.core.redis_client import get_redis; r = get_redis(); exit(0 if r and r.ping() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Scale workers as needed
    deploy:
      replicas: 2

  nginx:
    image: nginx:alpine
    container_name: idea2_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local

