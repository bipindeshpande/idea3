<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Large "S" letter - centered and prominent -->
  <g transform="translate(250, 100)">
    <path d="M 0 0 
             Q 100 0 200 0 
             Q 300 0 400 0 
             Q 400 50 200 50 
             Q 0 50 0 100 
             Q 0 150 200 150 
             Q 400 150 400 200 
             Q 400 250 200 250 
             Q 0 250 0 300" 
          stroke="#2563EB" 
          stroke-width="80" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
  
  <!-- Site Name - Using system fonts for better compatibility -->
  <text x="600" y="380" 
        font-family="system-ui, -apple-system, Arial, sans-serif" 
        font-size="72" 
        font-weight="bold" 
        fill="#1A1A1A" 
        text-anchor="middle">
    Startup Idea Advisor
  </text>
  
  <!-- Tagline -->
  <text x="600" y="450" 
        font-family="system-ui, -apple-system, Arial, sans-serif" 
        font-size="36" 
        fill="#6B7280" 
        text-anchor="middle">
    Validate Ideas &amp; Discover Opportunities
  </text>
  
  <!-- Accent line -->
  <line x1="400" y1="480" x2="800" y2="480" 
        stroke="#2563EB" 
        stroke-width="4" 
        stroke-linecap="round"/>
</svg>
